name: Rust Native Windows Preview
on:
  push:
    branches: [rust-windows-native]
    paths:
      - 'rust-native/**'
      - '.github/workflows/rust-windows-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        working-directory: rust-native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-native
      - name: Unit tests
        run: cargo test
      - name: Build Windows x64 EXE
        run: cargo build --release
      - name: Validate portable executable
        shell: pwsh
        run: |
          $exe = 'target/release/CurrentEarthWallpaperNative.exe'
          if (-not (Test-Path $exe)) { throw "Missing EXE" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($bytes.Length -lt 10000 -or $bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw "Invalid Windows EXE" }
          (Get-FileHash $exe -Algorithm SHA256).Hash | Out-File -FilePath target/release/SHA256.txt
      - name: Offline WIC image rendering smoke test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "target/release/CurrentEarthWallpaperNative.exe" -ArgumentList "--self-test-render" -NoNewWindow -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Offline image rendering test failed with exit $($p.ExitCode)" }
      - name: Real GOES-East and GOES-West WinHTTP + WIC probe
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "target/release/CurrentEarthWallpaperNative.exe" -ArgumentList "--self-test-goes" -PassThru -Wait
          if (Test-Path "target/release/live-goes.json") {
            Get-Content "target/release/live-goes.json" | Write-Host
          }
          if ($p.ExitCode -ne 0) { throw "At least one GOES endpoint was unreachable or returned undecodable image" }
      - name: FY4B HTTPS transport and image decode probe
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "target/release/CurrentEarthWallpaperNative.exe" -ArgumentList "--self-test-fy4b-https" -PassThru -Wait
          if (Test-Path "target/release/fy4b-https.json") {
            Get-Content "target/release/fy4b-https.json" | Write-Host
          }
          if ($p.ExitCode -ne 0) { throw "FY4B HTTPS endpoint unavailable or WIC decode failed - investigate before stable release" }
      - name: Cargo clippy static analysis
        run: cargo clippy --all-targets
      - name: Live Meteosat WMS latest-observation metadata diagnostic
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "target/release/CurrentEarthWallpaperNative.exe" -ArgumentList "--self-test-meteosat-time" -PassThru -Wait
          if (Test-Path "target/release/meteosat-probe.json") {
            Get-Content "target/release/meteosat-probe.json" | Write-Host
          } else { throw "Meteosat probe report missing" }
          if ($p.ExitCode -ne 0) { throw "EUMETSAT WMS latest TIME lookup or image decoding failed" }
      - name: Read-only virtual desktop registry diagnostic
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "target/release/CurrentEarthWallpaperNative.exe" -ArgumentList "--virtual-desktop-probe" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Desktop registry probe crashed" }
          if (-not (Test-Path "target/release/virtual-desktop-probe.json")) { throw "Desktop diagnostic report missing" }
          Get-Content "target/release/virtual-desktop-probe.json" | Write-Host
      - name: Validate isolated private COM helper is fail-closed (Windows Server)
        shell: pwsh
        run: |
          $json = & "target/release/CurrentEarthWallpaperNative.exe" --vd-native-probe
          $report = $json | ConvertFrom-Json
          Write-Host "Private COM support: $($report.available) / $($report.error)"
          # Windows Server CI is not target Windows 11 26H2. Probe must never write wallpaper.
          if ($report.writes_wallpaper -eq $true) { throw "Unsafe private COM probe" }
      - name: Idle memory sampling (real Windows process)
        shell: pwsh
        run: |
          $samples = @()
          $p = Start-Process -FilePath "target/release/CurrentEarthWallpaperNative.exe" -ArgumentList "--memory-probe" -PassThru
          try {
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              if ($p.HasExited) { throw "GUI exited unexpectedly with code $($p.ExitCode)" }
              $live = Get-Process -Id $p.Id
              $samples += [pscustomobject]@{
                elapsedSeconds = [math]::Round(($i+1)*0.25, 2)
                workingSetMiB = [math]::Round($live.WorkingSet64 / 1MB, 2)
                privateMiB = [math]::Round($live.PrivateMemorySize64 / 1MB, 2)
              }
            }
            $peak = ($samples | Measure-Object workingSetMiB -Maximum).Maximum
            $end = $samples[-1]
            Write-Host "Idle working set last=$($end.workingSetMiB) MiB peak=$peak MiB; private=$($end.privateMiB) MiB"
            $samples | ConvertTo-Json -Depth 4 | Set-Content -Path "target/release/memory-idle.json"
            if ($peak -gt 100) { throw "Idle working set > 100 MiB" }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
      - name: Hidden-window single-instance takeover integration test
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'target/release/CurrentEarthWallpaperNative.exe').Path
          $first = $null
          $second = $null
          $third = $null
          try {
            # The GUI remains hidden, has no need for a tray icon, and does not run downloads.
            $first = Start-Process -FilePath $exe -ArgumentList '--instance-test-hidden' -PassThru
            Start-Sleep -Milliseconds 1800
            if ($first.HasExited) { throw "Initial hidden GUI terminated unexpectedly" }
            $second = Start-Process -FilePath $exe -ArgumentList '--instance-test-hidden' -PassThru
            if (-not $first.WaitForExit(15000)) { throw "Starting second EXE did not close first GUI" }
            if ($first.ExitCode -ne 0) { throw "First GUI exited abnormally: $($first.ExitCode)" }
            Start-Sleep -Milliseconds 800
            $second.Refresh()
            if ($second.HasExited) { throw "Replacement GUI unexpectedly exited" }
            $third = Start-Process -FilePath $exe -ArgumentList '--instance-test-hidden' -PassThru
            if (-not $second.WaitForExit(15000)) { throw "Starting third EXE did not close second GUI" }
            Start-Sleep -Milliseconds 600
            $third.Refresh()
            if ($third.HasExited) { throw "Last GUI unexpectedly exited" }
            Write-Host "PASS: hidden GUI 1 -> GUI 2 -> GUI 3, all replaced cleanly"
          } finally {
            foreach ($p in @($first,$second,$third)) {
              if ($null -ne $p) {
                $p.Refresh()
                if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
              }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: CurrentEarthWallpaper-Rust-Native-Preview
          path: |
            rust-native/target/release/CurrentEarthWallpaperNative.exe
            rust-native/target/release/SHA256.txt
            rust-native/target/release/memory-idle.json
            rust-native/target/release/memory-render.json
            rust-native/target/release/live-goes.json
            rust-native/target/release/meteosat-probe.json
            rust-native/target/release/fy4b-https.json
            rust-native/target/release/virtual-desktop-probe.json
          retention-days: 30
          if-no-files-found: error
